<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxa | hwoxan</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300f0ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='4' y='2' width='16' height='20' rx='2' ry='2'></rect><line x1='8' y1='6' x2='16' y2='6'></line><line x1='16' y1='14' x2='16' y2='14'></line><line x1='8' y1='10' x2='8' y2='10'></line><line x1='12' y1='10' x2='12' y2='10'></line><line x1='16' y1='10' x2='16' y2='10'></line><line x1='8' y1='14' x2='8' y2='14'></line><line x1='12' y1='14' x2='12' y2='14'></line><line x1='8' y1='18' x2='8' y2='18'></line><line x1='12' y1='18' x2='12' y2='18'></line><line x1='16' y1='18' x2='16' y2='18'></line></svg>">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #05060b;
            --bg-card: rgba(10, 13, 24, 0.88);
            --neon-cyan: #00f0ff;
            --neon-yellow: #fcee0a;
            --neon-magenta: #ff007f;
            --neon-green: #05ffa1;
            --neon-red: #ff3344;
            --text-main: #f1f5f9;
            --text-muted: #627290;
            --border-hud: rgba(0, 240, 255, 0.28);
            --border-hud-glow: rgba(0, 240, 255, 0.6);
            --input-bg: rgba(6, 9, 18, 0.95);
            --transition: 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Chakra Petch', system-ui, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            overflow-x: hidden;
            position: relative;
        }

        /* Grade de Fundo & Overlay CRT Scanlines */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 1;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 2;
            opacity: 0.7;
        }

        /* Brilhos de Iluminação Cyberpunk */
        .ambient-glow {
            position: fixed;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 380px;
            background: radial-gradient(ellipse at center, rgba(0, 240, 255, 0.15) 0%, rgba(255, 0, 127, 0.08) 45%, transparent 70%);
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }

        /* Container Principal Chanfrado HUD */
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-card);
            padding: 2.5rem;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-hud);
            clip-path: polygon(
                0 18px, 
                18px 0, 
                calc(100% - 18px) 0, 
                100% 18px, 
                100% calc(100% - 18px), 
                calc(100% - 18px) 100%, 
                18px 100%, 
                0 calc(100% - 18px)
            );
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.12), inset 0 0 20px rgba(0, 240, 255, 0.04);
            animation: containerGlitch 0.4s ease-out;
        }

        /* Cantoneiras HUD decorativas */
        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
        }

        /* Top HUD Bar */
        .hud-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed rgba(0, 240, 255, 0.2);
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            color: var(--neon-cyan);
            text-transform: uppercase;
        }

        .hud-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hud-dot {
            width: 6px;
            height: 6px;
            background: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .audio-toggle-btn {
            background: transparent;
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: var(--neon-cyan);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            padding: 3px 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: var(--transition);
        }

        .audio-toggle-btn:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .header .badge-tag {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            color: var(--neon-yellow);
            background: rgba(252, 238, 10, 0.1);
            border: 1px solid rgba(252, 238, 10, 0.3);
            padding: 2px 10px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Orbitron', monospace;
            font-size: 1.85rem;
            font-weight: 900;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6), 0 0 20px rgba(0, 240, 255, 0.3);
            margin-bottom: 0.35rem;
        }

        h1 span {
            color: var(--neon-cyan);
        }

        p.subtitle {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted);
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.45rem;
            font-family: 'Orbitron', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--neon-cyan);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper span.prefix {
            position: absolute;
            left: 1rem;
            color: var(--neon-yellow);
            font-family: 'Orbitron', monospace;
            font-weight: 800;
            font-size: 0.95rem;
            pointer-events: none;
            text-shadow: 0 0 6px rgba(252, 238, 10, 0.5);
        }

        input[type="number"] {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.85rem;
            background: var(--input-bg);
            border: 1px solid var(--border-hud);
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.15rem;
            font-weight: 700;
            transition: all var(--transition);
            clip-path: polygon(0 8px, 8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.35), inset 0 0 8px rgba(0, 240, 255, 0.2);
            background: #090e1c;
        }

        /* Configurações Expansíveis de Taxas */
        .tax-config-panel {
            background: rgba(0, 240, 255, 0.03);
            border: 1px dashed rgba(0, 240, 255, 0.25);
            padding: 14px;
            margin-bottom: 1.25rem;
            display: none;
            gap: 12px;
            animation: fadeIn 0.25s ease-out;
        }

        .tax-config-panel input[type="number"] {
            padding: 0.65rem 0.75rem;
            font-size: 0.95rem;
        }

        .btn-toggle-cfg {
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            text-decoration: none;
            cursor: pointer;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .btn-toggle-cfg:hover {
            color: var(--neon-yellow);
        }

        /* Botão Primário Cyberpunk Chanfrado */
        button.btn-primary {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--neon-cyan) 0%, #0099ff 100%);
            color: #000;
            border: none;
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 0.95rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all var(--transition);
            clip-path: polygon(0 12px, 12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            position: relative;
            overflow: hidden;
        }

        button.btn-primary:hover {
            background: linear-gradient(135deg, var(--neon-yellow) 0%, #ffcc00 100%);
            box-shadow: 0 0 28px rgba(252, 238, 10, 0.6);
            transform: translateY(-2px);
        }

        button.btn-primary:active {
            transform: translateY(0);
        }

        .results-area {
            margin-top: 2rem;
            border-top: 1 dashed rgba(0, 240, 255, 0.25);
            padding-top: 1.5rem;
            display: none;
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Card de Resultado Sci-Fi */
        .result-card {
            background: rgba(8, 12, 22, 0.9);
            padding: 1.25rem 1.4rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border-hud);
            clip-path: polygon(0 8px, 8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
            transition: all var(--transition);
            position: relative;
        }

        .result-card:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.2);
            transform: translateX(4px);
        }

        .result-card.card-debito:hover {
            border-color: var(--neon-yellow);
            box-shadow: 0 0 16px rgba(252, 238, 10, 0.2);
        }

        .result-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-info span {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
            margin-bottom: 0.35rem;
        }

        .result-value {
            font-family: 'Orbitron', monospace;
            font-size: 1.35rem;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 12px rgba(5, 255, 161, 0.45);
        }

        .result-card.card-debito .result-value {
            color: var(--neon-cyan);
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.45);
        }

        /* Botão Copiar HUD */
        .btn-copy {
            background: transparent;
            border: 1px solid rgba(0, 240, 255, 0.35);
            color: var(--neon-cyan);
            font-family: 'JetBrains Mono', monospace;
            padding: 0.45rem 0.85rem;
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            transition: all var(--transition);
            clip-path: polygon(0 4px, 4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%);
        }

        .btn-copy:hover {
            border-color: var(--neon-cyan);
            color: #000;
            background: var(--neon-cyan);
            box-shadow: 0 0 12px var(--neon-cyan);
        }

        .error-msg {
            color: var(--neon-red);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            margin-top: 0.6rem;
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        footer {
            margin-top: 2.2rem;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted);
            font-size: 0.75rem;
            padding-top: 1.25rem;
            border-top: 1 dashed rgba(0, 240, 255, 0.15);
            letter-spacing: 0.06em;
        }

        footer a {
            color: var(--neon-cyan);
            text-decoration: none;
            font-weight: 700;
            transition: color var(--transition);
        }

        footer a:hover {
            color: var(--neon-yellow);
            text-shadow: 0 0 8px rgba(252, 238, 10, 0.6);
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.85rem 1.4rem;
            }
            h1 {
                font-size: 1.5rem;
            }
            .result-value {
                font-size: 1.15rem;
            }
        }
    </style>
</head>

<body data-theme="dark">
    <div class="ambient-glow"></div>

    <div class="container">
        <!-- Status Bar Cyberpunk -->
        <div class="hud-status-bar">
            <div class="hud-indicator">
                <span class="hud-dot"></span>
                <span>SYS_ONLINE // V2.0</span>
            </div>
            <button class="audio-toggle-btn" id="audioToggle" onclick="toggleAudio()" title="Alternar sintetizador de som">
                SFX: ON
            </button>
        </div>

        <header class="header">
            <span class="badge-tag">CYBER FINANCIAL HUD</span>
            <h1><span>TAXINHA</span></h1>
            <p class="subtitle">&gt; Simulação de liquidação e taxas</p>
        </header>

        <main>
            <div class="form-group">
                <label for="valorOriginal">VALOR DA TRANSAÇÃO</label>
                <div class="input-wrapper">
                    <span class="prefix">R$</span>
                    <input type="number" id="valorOriginal" placeholder="0.00" step="0.01" min="0" autocomplete="off">
                </div>
                <p id="errorMsg" class="error-msg">[ERR_INPUT]: Insira um valor numérico válido.</p>
            </div>

            <!-- Painel de Customização de Taxas -->
            <div id="taxSettings" style="display: none; flex-direction: column; gap: 10px; margin-bottom: 1.5rem;">
                <div style="display: flex; gap: 10px; width: 100%;">
                    <div style="flex: 1;">
                        <label for="taxaCredito" style="font-size: 0.65rem;">TAXA CRÉDITO (%)</label>
                        <input type="number" id="taxaCredito" value="4" step="0.1" min="0">
                    </div>
                    <div style="flex: 1;">
                        <label for="taxaDebito" style="font-size: 0.65rem;">TAXA DÉBITO (%)</label>
                        <input type="number" id="taxaDebito" value="2" step="0.1" min="0">
                    </div>
                </div>
            </div>

            <button type="button" style="background: none; border: none; color: var(--text-muted); font-size: 0.8rem; text-decoration: underline; cursor: pointer; margin-bottom: 1rem; display: block; width: 100%; text-align: center;" onclick="toggleTaxSettings()">Configurar Taxas</button>

            <button class="btn-primary" onclick="calcularTaxas()">PROCESSAR TRANSAÇÃO</button>

            <section id="resultsArea" class="results-area">
                <div class="result-card">
                    <div class="result-content">
                        <div class="result-info">
                            <span>Crédito (Valor com Desconto da Taxa)</span>
                            <div class="result-value" id="resCredito">R$ 0,00</div>
                        </div>
                        <button class="btn-copy" onclick="copyValue('resCredito', this)">[COPIAR]</button>
                    </div>
                </div>

                <div class="result-card card-debito">
                    <div class="result-content">
                        <div class="result-info">
                            <span>Débito (Valor com Desconto da Taxa)</span>
                            <div class="result-value" id="resDebito">R$ 0,00</div>
                        </div>
                        <button class="btn-copy" onclick="copyValue('resDebito', this)">[COPIAR]</button>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            TERMINAL // CRIADO POR <a href="https://t.me/pudim" target="_blank" rel="noopener noreferrer">@hwoxan</a>
        </footer>
    </div>

    <script>
        // Sistema de Síntese de Som Sci-Fi (Web Audio API)
        let sfxEnabled = true;
        let audioCtx = null;

        function playSciFiSound(type = 'click') {
            if (!sfxEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'click') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(450, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'calc') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'copy') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(1040, now + 0.16);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.16);
                    osc.start(now);
                    osc.stop(now + 0.16);
                }
            } catch (e) {
                // AudioContext indisponível ou bloqueado
            }
        }

        function toggleAudio() {
            sfxEnabled = !sfxEnabled;
            const btn = document.getElementById('audioToggle');
            btn.innerText = `SFX: ${sfxEnabled ? 'ON' : 'OFF'}`;
            btn.style.color = sfxEnabled ? 'var(--neon-cyan)' : 'var(--text-muted)';
            btn.style.borderColor = sfxEnabled ? 'rgba(0, 240, 255, 0.3)' : 'rgba(100, 116, 139, 0.3)';
            if (sfxEnabled) playSciFiSound('click');
        }

        const formatador = new Intl.NumberFormat('pt-BR', {
            style: 'currency',
            currency: 'BRL'
        });

        function calcularTaxas() {
            playSciFiSound('calc');

            const input = document.getElementById("valorOriginal");
            const valor = parseFloat(input.value);
            const errorMsg = document.getElementById("errorMsg");
            const resultsArea = document.getElementById("resultsArea");

            if (isNaN(valor) || valor <= 0) {
                errorMsg.style.display = "flex";
                resultsArea.style.display = "none";
                input.style.borderColor = "var(--neon-red)";
                input.style.boxShadow = "0 0 14px rgba(255, 51, 68, 0.4)";
                return;
            }

            errorMsg.style.display = "none";
            input.style.borderColor = "var(--border-hud)";
            input.style.boxShadow = "none";
            resultsArea.style.display = "block";

            const taxaCredito = parseFloat(document.getElementById("taxaCredito").value) / 100;
            const taxaDebito = parseFloat(document.getElementById("taxaDebito").value) / 100;

            const totalCredito = valor * (1 - taxaCredito);
            const totalDebito = valor * (1 - taxaDebito);

            document.getElementById("resCredito").innerText = formatador.format(totalCredito);
            document.getElementById("resDebito").innerText = formatador.format(totalDebito);
        }

        function copyValue(id, btn) {
            playSciFiSound('copy');
            const text = document.getElementById(id).innerText;
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.innerText;
                btn.innerText = "[OK COPIADO]";
                btn.style.color = "#000";
                btn.style.backgroundColor = "var(--neon-green)";
                btn.style.borderColor = "var(--neon-green)";
                btn.style.boxShadow = "0 0 14px var(--neon-green)";

                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.color = "";
                    btn.style.backgroundColor = "";
                    btn.style.borderColor = "";
                    btn.style.boxShadow = "";
                }, 1500);
            });
        }

        function toggleTaxSettings() {
            playSciFiSound('click');
            const settings = document.getElementById('taxSettings');
            const isHidden = settings.style.display === 'none' || settings.style.display === '';
            settings.style.display = isHidden ? 'flex' : 'none';
        }

        // Suporte à tecla ENTER
        ['valorOriginal', 'taxaCredito', 'taxaDebito'].forEach(id => {
            document.getElementById(id).addEventListener('keypress', (e) => {
                if (e.key === "Enter") calcularTaxas();
            });
        });
    </script>
</body>

</html>
